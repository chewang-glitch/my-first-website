<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Oversized Tee | Brand</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f11;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .product-card {
      background: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 16px;
      display: flex;
      flex-direction: row;
      max-width: 800px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .product-image {
      flex: 1;
      background: #232329;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .product-image img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
    }

    .product-details {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tag {
      color: #6366f1;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .price {
      font-size: 1.5rem;
      font-weight: 600;
      color: #22c55e;
      margin-bottom: 16px;
    }

    .description {
      color: #a1a1aa;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .buy-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      text-align: center;
    }

    .buy-btn:hover {
      background: #4f46e5;
    }

    /* Responsive fix for smaller screens */
    @media (max-width: 600px) {
      .product-card {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="product-card">
    <div class="product-image">
      <!-- Replace with your actual artwork/t-shirt image URL -->
      <img src="https://via.placeholder.com/300x350/232329/ffffff?text=Your+Design+Here" alt="T-Shirt Mockup">
    </div>
    <div class="product-details">
      <span class="tag">Heavyweight Drop</span>
      <h1>Cyberpunk Oversized Tee</h1>
      <div class="price">₹799 <span style="font-size: 0.9rem; color: #71717a; text-decoration: line-through;">₹1,299</span></div>
      <p class="description">240 GSM 100% Super Combed Cotton. Premium streetwear fit with custom front and back high-density print.</p>
      <button class="buy-btn">Order via UPI</button>
    </div>
  </div>

</body>
</html>
